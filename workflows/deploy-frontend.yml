# Copiar este archivo a: Proyecto/Frontend/.github/workflows/deploy-frontend.yml
# Basado en Frontend_pd_test/.github/workflows/despliegue-eks.yml (mismo patron
# build -> push ECR -> update kubeconfig -> kubectl apply), adaptado al
# manifiesto real k8s/frontend/frontend.yaml de este proyecto.
name: Deploy Frontend to EKS

on:
  push:
    branches: [ deploy ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: repo_petdate_frontend          # debe existir en ECR (o crearlo en el job)
  EKS_CLUSTER_NAME: petdate-cluster

jobs:
  build-and-deploy:
    name: Build, Push and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Autenticarse en AWS con las credenciales temporales del Lab (GitHub Secrets)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # 2. Login en Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Build + push de la imagen Docker (multi-stage Node -> Nginx)
      - name: Build, tag and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}     # hash del commit como tag, para trazabilidad
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # 4. Configurar kubectl contra el cluster EKS
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      # 5. Sustituir el placeholder de imagen y aplicar el manifiesto
      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/repo_petdate_frontend:\${IMAGE_TAG}|$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" k8s/frontend/frontend.yaml
          kubectl apply -f k8s/frontend/frontend.yaml
          kubectl rollout status deployment/frontend -n petdate --timeout=180s

      # 6. Evidencia para el informe (IE6: logs/metricas del pipeline)
      - name: Show rollout summary
        run: kubectl get pods -n petdate -l app=frontend -o wide
